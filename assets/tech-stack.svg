  <rect class="accent" x="36" y="163" width="3" height="17" rx="1.5"/><text class="heading" x="50" y="177">INFRASTRUCTURE</text>
  <g transform="translate(36 194)"><rect class="item" width="374" height="48" rx="5"/><path class="icon" d="M17 21l12-7 12 7-12 7-12-7zm0 0v12l12 7 12-7V21m-12 7v12"/><text class="label" x="58" y="29">Docker</text><circle class="dot" cx="352" cy="24" r="2"/></g>
  <g transform="translate(428 194)"><rect class="item" width="376" height="48" rx="5"/><path class="icon" d="M20 31h19M29.5 14v17m-7-10 7-7 7 7m-16 7 9 7 9-7"/><text class="label" x="58" y="29">Linux</text></g>
