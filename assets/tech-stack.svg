  <g transform="translate(562 320)"><rect class="item" width="242" height="48" rx="5"/><path class="icon" d="M18 16h22v17H18zM23 21h12m-12 5h8M14 20v17h22"/><text class="label" x="56" y="29">Playwright / Selenium</text></g>
