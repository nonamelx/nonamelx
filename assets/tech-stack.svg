  <rect class="accent" x="568" y="415" width="3" height="17" rx="1.5"/><text class="heading" x="582" y="429">BLOCKCHAIN</text>
  <g transform="translate(568 446)"><rect class="item" width="236" height="48" rx="5"/><path class="icon" d="M29 13l10 6v11l-10 6-10-6V19l10-6zm0 0v11m10-5-10 5-10-5m10 5v12"/><text class="label" x="56" y="29">Web3 / Blockchain</text></g>
