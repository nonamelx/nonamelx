  <rect class="accent" x="36" y="289" width="3" height="17" rx="1.5"/><text class="heading" x="50" y="303">AUTOMATION &amp; INTEGRATIONS</text>
  <g transform="translate(36 320)"><rect class="item" width="242" height="48" rx="5"/><path class="icon" d="M17 24h24m-7-7 7 7-7 7m-10-14-7 7 7 7"/><text class="label" x="56" y="29">REST APIs</text><circle class="dot" cx="222" cy="24" r="2"/></g>
