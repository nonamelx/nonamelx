<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 570" role="img" aria-labelledby="title desc">
  <title id="title">Technical stack</title>
  <desc id="desc">Eleven technologies grouped by language, infrastructure, automation and integrations, AI, and blockchain.</desc>
  <style>
    .bg { fill: #0D1117; }
    .group { fill: #11151B; stroke: #30343C; stroke-width: 1; }
    .item { fill: #0D1117; stroke: #30343C; stroke-width: 1; }
    .accent { fill: #9F2938; }
    .heading { fill: #D4D4D8; font: 600 15px Arial, Helvetica, sans-serif; letter-spacing: 1.2px; }
    .label { fill: #D4D4D8; font: 14px Arial, Helvetica, sans-serif; }
    .icon { fill: none; stroke: #8B919B; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .dot { fill: #9F2938; }
  </style>
  <rect class="bg" width="840" height="570" rx="8"/>
  <!-- Languages -->
  <rect class="group" x="20" y="20" width="800" height="112" rx="7"/>
  <rect class="accent" x="36" y="37" width="3" height="17" rx="1.5"/>
  <text class="heading" x="50" y="51">LANGUAGES</text>
  <g transform="translate(36 68)">
    <rect class="item" width="242" height="48" rx="5"/><path class="icon" d="M22 16l-7 8 7 8m10-16 7 8-7 8m-3-20-5 24"/><text class="label" x="56" y="29">Python</text><circle class="dot" cx="222" cy="24" r="2"/>
  </g>
  <g transform="translate(299 68)">
    <rect class="item" width="242" height="48" rx="5"/><path class="icon" d="M17 17h18v15H17zM21 12h10v5m-5 0v15m-5-10h10"/><text class="label" x="56" y="29">JavaScript</text><circle class="dot" cx="222" cy="24" r="2"/>
  </g>
  <g transform="translate(562 68)">
    <rect class="item" width="242" height="48" rx="5"/><ellipse class="icon" cx="29" cy="19" rx="11" ry="4"/><path class="icon" d="M18 19v12c0 2 5 4 11 4s11-2 11-4V19m-22 6c0 2 5 4 11 4s11-2 11-4"/><text class="label" x="56" y="29">SQL / PostgreSQL</text>
  </g>
